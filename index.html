<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Conilious Dube | Mechanical CAD Design & Simulation</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary: #0366d6;
  --accent-red: #d62828;
  --accent-blue: #0366d6;
  --super-black: #0a0c10;
  --text-gray: #4b5563;
  --border-light: #e5e7eb;
  --bg-offwhite: #f8fafc;
  --star-gold: #f59e0b;

  --header-height-desktop: 96px;
  --header-height-mobile: 88px;
}

/* Reset & base */
*{box-sizing:border-box}
html,body{height:100%; width:100%; margin:0; padding:0; overflow-x:hidden; font-family:'Inter',sans-serif; background:#ffffff; color:var(--super-black); -webkit-font-smoothing:antialiased; scroll-behavior:smooth;}
body { padding-top: var(--header-height-desktop); }
section { scroll-margin-top: 100px; width: 100%; }

/* HEADER - Base Styles */
.site-header{
  position:fixed; top:0; left:0; right:0; height:var(--header-height-desktop);
  z-index:1000; display:flex; align-items:center; background: transparent; border: none; box-shadow: none; width: 100%;
}
.navbar{ width:100%; max-width:100%; margin:0 auto; padding:10px 60px; display:flex; align-items:center; justify-content:space-between; gap:12px; }

/* Logo block - Mobile Default */
.logo{ display:flex; align-items:center; flex-shrink:0; text-decoration: none; }
.logo-icon{height:48px;width:auto;display:block}
.logo-text{display:flex;flex-direction:column;line-height:1.02;white-space:nowrap;}
.logo-text .name{font-size:1.3rem;font-weight:800;color:var(--accent-red);line-height:1}
.logo-text .tagline{font-size:0.85rem;font-weight:600;color:var(--accent-blue);margin-top:2px}

/* Navigation Group & Links */
.nav-links{display:flex;list-style:none;margin:0;padding:0;}
.nav-links a{text-decoration:none;color:var(--super-black);font-weight:600;white-space:nowrap;transition:color .2s ease}
.nav-links a:hover{color:var(--primary)}
.cta-btn{background:var(--primary);color:#fff;border-radius:8px;font-weight:600;text-decoration:none;transition:all .2s ease; border: none; cursor: pointer; font-family: inherit;}
.cta-btn:hover{background:#024da3; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(3,102,214,0.3);}

/* Hamburger Menu Button */
.menu-toggle { background: none; border: none; cursor: pointer; padding: 10px; z-index: 1001; position: relative; }
.hamburger, .hamburger::before, .hamburger::after { display: block; width: 25px; height: 3px; background-color: var(--super-black); transition: all 0.3s ease-in-out; position: absolute; }
.hamburger::before { content: ''; top: -8px; left: 0; }
.hamburger::after { content: ''; top: 8px; left: 0; }
.menu-toggle.is-active .hamburger { background-color: transparent; }
.menu-toggle.is-active .hamburger::before { top: 0; transform: rotate(45deg); }
.menu-toggle.is-active .hamburger::after { top: 0; transform: rotate(-45deg); }

/* HERO */
.hero{ position:relative; min-height:100vh; display:flex; align-items:flex-start; justify-content:center; text-align:center; padding:40px 10% 80px; overflow:hidden; width: 100%;}
.video-wrap{ position:absolute; inset:0; z-index:0; background:#000; overflow:hidden; width: 100%;}
.video-wrap::after { content: ""; position: absolute; inset: 0; z-index: 2; background: radial-gradient(ellipse 150% 100% at 50% 0%, rgba(255,255,255,1) 0%, rgba(255,255,255,0.85) 15%, rgba(255,255,255,0) 55%); pointer-events: none; }
.hero-video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; filter: contrast(1.1) saturate(1.15) brightness(1.02); }

.hero-content{ position:relative; z-index:3; max-width:900px; padding:0 24px; margin-top:0; animation:fadeUp 1.1s ease forwards; opacity:0; transform:translateY(18px); width: 100%; }
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

.hero h1{font-size:clamp(2.2rem,5vw,4.2rem);font-weight:800;line-height:1.15;margin:0 0 18px;color:var(--super-black);letter-spacing:-0.02em}
.red-accent{color:var(--accent-red)}
.blue-accent{color:var(--accent-blue)}
.neutral-accent{color:var(--super-black)}
.hero p{font-size:clamp(1rem,2.2vw,1.3rem); margin:0 auto 24px; line-height:1.6; color:#ffffff; font-weight:500; max-width:700px; text-shadow:0 1px 0 rgba(0,0,0,0.85), 0 4px 12px rgba(0,0,0,0.6);}

.software-badges{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.badge{ background:rgba(3, 102, 214, 0.75); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(255, 255, 255, 0.3); color:#fff; padding:10px 20px; border-radius:12px; font-size:1rem; font-weight:600; display:inline-block; box-shadow:0 6px 16px rgba(0, 0, 0, 0.25); }

/* BODY STYLES */
.reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
.reveal.is-visible { opacity: 1; transform: translateY(0); }

.section-header{text-align:center;margin-bottom:60px}
.section-header h2{font-size:clamp(2rem, 4vw, 2.6rem);font-weight:800;color:var(--super-black);margin-bottom:16px;letter-spacing:-0.02em}
.section-header p{font-size:1.15rem;color:var(--text-gray);max-width:650px;margin:0 auto;line-height:1.7;font-weight:400}

/* FEATURED PROJECTS */
.featured-project{padding:120px 5% 80px;background:#ffffff}
.project-container{ display:flex; gap:40px; background:#fff; border-radius:20px; border: 1px solid var(--border-light); box-shadow: 0 4px 24px rgba(0,0,0,0.02); padding:40px; align-items:center; max-width: 1200px; margin: 0 auto 40px; transition: box-shadow .4s ease, transform .4s ease; width: 100%;}
.project-container:hover{ box-shadow: 0 12px 40px rgba(0,0,0,0.06); transform:translateY(-4px); }
.project-image{flex: 1;}
.project-image img{width:100%;height:auto;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.08);object-fit:cover;}
.project-details{flex: 1; padding-left: 20px;}
.project-details h3{font-size:1.8rem;font-weight:800;margin-bottom:16px;color:var(--super-black);letter-spacing:-0.01em;}
.project-details p{font-size:1.1rem;line-height:1.7;margin-bottom:24px;color:var(--text-gray)}
.project-highlights{list-style:none;padding:0;margin:0;font-size:1.05rem;line-height:1.8;color:var(--super-black);font-weight:500;}
.project-highlights li{margin-bottom:12px;position:relative;padding-left:24px}
.project-highlights li::before{content:"→";color:var(--primary);position:absolute;left:0;font-weight:bold;}

/* GALLERY TRIGGER CARD */
.gallery-trigger-card {
  width: 100%; max-width: 1200px; margin: 40px auto 0; padding: 50px 40px; border-radius: 24px; text-align: center;
  cursor: pointer; position: relative; overflow: hidden;
  background: #ffffff;
  border: 1px solid var(--border-light);
  box-shadow: 0 4px 24px rgba(0,0,0,0.02);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease, border-color 0.4s ease;
}
.gallery-trigger-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 20px 50px rgba(3, 102, 214, 0.08);
  border-color: rgba(3, 102, 214, 0.3); 
}
.gallery-trigger-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
.gallery-trigger-card h2 { color: var(--super-black); font-size: clamp(1.8rem, 3vw, 2.4rem); font-weight: 800; margin-bottom: 12px; letter-spacing: -0.02em; }
.gallery-trigger-card p { color: var(--text-gray); font-size: 1.15rem; font-weight: 500; margin-bottom: 24px; }

.gallery-pulsing-btn {
  display: inline-flex; align-items: center; gap: 10px;
  background: rgba(3, 102, 214, 0.1); color: var(--primary);
  padding: 12px 24px; border-radius: 50px; font-weight: 600; font-size: 1.05rem;
  border: 1px solid rgba(3, 102, 214, 0.2); transition: all 0.3s ease;
}
.gallery-trigger-card:hover .gallery-pulsing-btn { background: var(--primary); color: #fff; }
.radar-dot { width: 10px; height: 10px; background: var(--primary); border-radius: 50%; position: relative; }
.radar-dot::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--primary); animation: radarPulse 1.5s infinite; }
.gallery-trigger-card:hover .radar-dot { background: #fff; }
.gallery-trigger-card:hover .radar-dot::after { border-color: #fff; }
@keyframes radarPulse { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }

/* LIGHTBOX */
.lightbox-overlay {
  position: fixed; inset: 0; background: rgba(10, 12, 16, 0.98); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  z-index: 10000; display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; transition: opacity 0.4s ease;
}
.lightbox-overlay.is-active { opacity: 1; visibility: visible; }
.lightbox-close {
  position: absolute; top: 30px; right: 40px; background: none; border: none; color: #fff;
  font-size: 3rem; font-weight: 300; cursor: pointer; transition: transform 0.3s ease; line-height: 1; z-index: 10001;
}
.lightbox-close:hover { transform: scale(1.1) rotate(90deg); }
.lightbox-content { position: relative; max-width: 90vw; max-height: 85vh; display: flex; align-items: center; justify-content: center; }
.lightbox-img { max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); display: none; user-select: none; }
.lightbox-img.active { display: block; animation: imageFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes imageFadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
.lightbox-controls { position: absolute; top: 50%; left: 0; width: 100%; display: flex; justify-content: space-between; transform: translateY(-50%); pointer-events: none; padding: 0 2vw; z-index: 10001; }
.lightbox-btn { pointer-events: auto; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; width: 60px; height: 60px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; backdrop-filter: blur(4px); }
.lightbox-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }

/* SERVICES */
.services{padding:120px 5%;background:var(--bg-offwhite); border-top: 1px solid var(--border-light);}
.services-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:32px;max-width: 1200px;margin: 0 auto;}
.service-card{ background:#fff; border-radius:16px; padding:40px 30px; border: 1px solid rgba(3,102,214,0.08); box-shadow: 0 4px 20px rgba(0,0,0,0.02); transition: transform .4s ease, box-shadow .4s ease, border-color .4s ease; }
.service-card:hover{ transform:translateY(-6px); box-shadow: 0 16px 40px rgba(3,102,214,0.08); border-color: rgba(3,102,214,0.2); }
.service-card h3{font-size:1.4rem;font-weight:700;margin-bottom:16px;color:var(--super-black)}
.service-card p{font-size:1.05rem;line-height:1.7;color:var(--text-gray);margin:0;}

/* ABOUT ME */
.about-section-wrapper{padding:120px 5%;background:#ffffff; border-top: 1px solid var(--border-light);} 
.about-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 80px; max-width: 1200px; margin: 0 auto; align-items: center; }
.about-image-col { position: relative; }
.about-image-col img { width: 100%; height: 600px; object-fit: cover; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
.about-content-col h2 { font-size: clamp(2rem, 4vw, 2.8rem); font-weight: 800; color: var(--super-black); margin-bottom: 24px; letter-spacing: -0.02em; }
.about-content-col p{ margin-bottom:24px; font-size:1.15rem; line-height:1.8; color:var(--text-gray); }
.about-content-col strong { color: var(--super-black); font-weight: 600; }

/* Stats Counter */
.about-stats { display: flex; gap: 40px; margin-bottom: 30px; }
.stat { text-align: left; }
.stat-number { font-size: 2.2rem; font-weight: 800; color: var(--primary); }
.plus { font-size: 2.2rem; font-weight: 800; color: var(--primary); margin-left: 2px; }
.stat p { margin: 5px 0 0; font-size: 0.95rem; color: var(--text-gray); }

/* REVIEWS */
.testimonials-section { padding: 120px 5%; background: var(--bg-offwhite); border-top: 1px solid var(--border-light); }
.testimonials-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 32px; max-width: 1200px; margin: 0 auto; }
.testimonial-card { background: #fff; border-radius: 16px; padding: 40px 30px; border: 1px solid var(--border-light); box-shadow: 0 4px 20px rgba(0,0,0,0.02); display: flex; flex-direction: column; justify-content: space-between; transition: transform .4s ease, box-shadow .4s ease; }
.testimonial-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.06); }
.stars { color: var(--star-gold); font-size: 1.2rem; margin-bottom: 16px; letter-spacing: 2px; }
.testimonial-text { font-size: 1.05rem; line-height: 1.7; color: var(--super-black); font-style: italic; margin-bottom: 24px; }
.testimonial-author { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--border-light); padding-top: 20px; }
.author-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--border-light); display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--text-gray); font-size: 1.1rem; }
.author-info h4 { margin: 0; font-size: 1rem; color: var(--super-black); font-weight: 700; }
.author-info span { font-size: 0.85rem; color: var(--text-gray); }

/* CONTACT */
.contact-section { padding: 120px 5%; background: #ffffff; border-top: 1px solid var(--border-light); }
.contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; max-width: 1200px; margin: 0 auto; align-items: center; }
.contact-info h2 { font-size: clamp(2rem, 4vw, 2.8rem); font-weight: 800; color: var(--super-black); margin-bottom: 20px; letter-spacing: -0.02em; }
.contact-info p { font-size: 1.15rem; color: var(--text-gray); line-height: 1.8; margin-bottom: 40px; }
.status-badge {
  display: inline-flex; align-items: center; gap: 10px; background: rgba(3, 102, 214, 0.1); color: var(--primary);
  padding: 8px 16px; border-radius: 50px; font-weight: 600; font-size: 0.95rem; margin-bottom: 24px;
  border: 1px solid rgba(3, 102, 214, 0.2); position: relative; overflow: hidden;
  animation: freelanceBadgePulse 2.8s ease-in-out infinite;
}
.status-badge::after{
  content:""; position:absolute; inset:0; background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.22) 50%, transparent 100%);
  transform: translateX(-120%); animation: freelanceBadgeShine 3.6s ease-in-out infinite;
}
.status-badge > *{ position: relative; z-index: 1; }
@keyframes freelanceBadgePulse {
  0%, 100% { transform: translateY(0) scale(1); box-shadow: 0 0 0 rgba(3,102,214,0); }
  50% { transform: translateY(-2px) scale(1.01); box-shadow: 0 10px 24px rgba(3,102,214,0.10); }
}
@keyframes freelanceBadgeShine {
  0% { transform: translateX(-120%); }
  35% { transform: translateX(120%); }
  100% { transform: translateX(120%); }
}
.status-dot { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px rgba(34, 197, 94, 0.6); animation: pulse 2s infinite; }
.contact-details-list { list-style: none; padding: 0; margin: 0; }
.contact-details-list li { margin-bottom: 24px; }
.contact-details-list span { display: block; font-size: 0.9rem; color: var(--text-gray); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
.contact-details-list a, .contact-details-list div { font-size: 1.25rem; font-weight: 600; color: var(--super-black); text-decoration: none; transition: color 0.2s; }
.contact-details-list a:hover { color: var(--primary); }

  background: var(--bg-offwhite); padding: 50px 40px; border-radius: 24px; 
  border: 1px solid var(--
