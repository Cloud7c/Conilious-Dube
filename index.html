<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Conilious Dube | Mechanical CAD Design & Simulation</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary: #0366d6;
  --accent-red: #d62828;
  --accent-blue: #0366d6;
  --super-black: #0a0c10;
  --text-gray: #4b5563;
  --border-light: #e5e7eb;
  --bg-offwhite: #f8fafc;
  --star-gold: #f59e0b;

  --header-height-desktop: 96px;
  --header-height-mobile: 88px;
}

/* (Existing styles unchanged up to modal) */

/* Success Step Styles */
.success-icon { background: #22c55e; }
.success-badges { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:15px 0; }
.success-badges .badge { font-size: 0.85rem; padding:8px 12px; }
.image-preview img { max-width: 100%; max-height: 120px; border-radius: 8px; margin-top: 20px; }
</style>
</head>
<body>

<!-- (Existing content unchanged up to the modal) -->

<div class="modal-overlay" id="wizardModal">
  <div class="modal-container">
    <div class="modal-header">
      <h2>Project Request</h2>
      <button class="modal-close" id="closeModalBtn">&times;</button>
      <div class="progress-bar">
        <div class="progress-step active" id="indicator1"></div>
        <div class="progress-step" id="indicator2"></div>
      </div>
    </div>

    <form id="wizardForm" action="https://formspree.io/f/mbdzeyny" method="POST" enctype="multipart/form-data">
      <div class="wizard-step is-active" id="step1">
        <!-- (Unchanged step1) -->
      </div>

      <div class="wizard-step" id="step2">
        <div class="modal-body">
          <h3>Tell me about your project</h3>
          <div class="form-group">
            <label for="clientName">Your Name</label>
            <input type="text" id="clientName" name="Name" class="form-input" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label for="clientEmail">Email Address</label>
            <input type="email" id="clientEmail" name="Email" class="form-input" placeholder="john@company.com" required>
          </div>
          <div class="form-group">
            <label for="clientDetails">Project Requirements</label>
            <textarea id="clientDetails" name="Project_Details" class="form-textarea" placeholder="Briefly describe what you need modeled or simulated..." required></textarea>
          </div>
          <!-- Added optional image upload field -->
          <div class="form-group">
            <label for="projectImage">Upload Image (optional)</label>
            <input type="file" id="projectImage" name="Project_Image" accept="image/*" class="form-input">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="backBtn">&larr; Back</button>
          <button type="submit" class="btn-primary" id="submitBtn">Submit Request</button>
        </div>
      </div>

      <!-- Modified success step -->
      <div class="wizard-step" id="step3">
        <div class="modal-body success-content" role="status" aria-live="polite">
          <div class="success-icon">&#10003;</div>
          <h3>Thank You!</h3>
          <p style="color: var(--text-gray); line-height: 1.6;">
            We've received your request! Here's what happens next:
          </p>
          <div class="success-badges">
            <span class="badge">Response in 24 hrs</span>
            <span class="badge">Project Review Started</span>
            <span class="badge">Schedule Meeting</span>
          </div>
          <div class="image-preview">
            <img id="uploadedThumb" src="" alt="Uploaded preview">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-primary" id="finishBtn">Close Window</button>
        </div>
      </div>

    </form>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // (Existing nav and reveal code unchanged)

    // Lightbox and gallery code unchanged...

    // Wizard modal logic (existing)...
    const modalOverlay = document.getElementById('wizardModal');
    const openBtns = document.querySelectorAll('.open-modal-btn');
    const closeBtn = document.getElementById('closeModalBtn');
    const finishBtn = document.getElementById('finishBtn');
    
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const step3 = document.getElementById('step3');
    
    const indicator1 = document.getElementById('indicator1');
    const indicator2 = document.getElementById('indicator2');
    
    const nextBtn = document.getElementById('nextBtn');
    const backBtn = document.getElementById('backBtn');
    const submitBtn = document.getElementById('submitBtn');
    const form = document.getElementById('wizardForm');
    const fileInput = document.getElementById('projectImage');

    // (Existing open/close modal code)...

    // Form submit logic with image handling
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!form.checkValidity()) return;

      submitBtn.innerText = 'Sending...';
      submitBtn.disabled = true;

      const data = new FormData(form);
      // FormData(form) already includes the file if provided (with enctype).
      fetch(form.action, { method: form.method, body: data, headers: { 'Accept': 'application/json' } })
      .then(response => {
        if (response.ok) {
          // Show uploaded image thumbnail if available
          if (fileInput.files.length > 0) {
            const thumb = document.getElementById('uploadedThumb');
            thumb.src = URL.createObjectURL(fileInput.files[0]);
            thumb.onload = () => URL.revokeObjectURL(thumb.src);
          } else {
            // Hide preview if no image
            document.getElementById('uploadedThumb').style.display = 'none';
          }
          // Transition to success step
          step2.classList.remove('is-active');
          step3.classList.add('is-active');
          document.querySelector('.progress-bar').style.display = 'none';
        } else {
          alert("Oops! There was a problem submitting your form.");
          submitBtn.innerText = 'Submit Request';
          submitBtn.disabled = false;
        }
      })
      .catch(error => {
        alert("Network error. Please try again.");
        submitBtn.innerText = 'Submit Request';
        submitBtn.disabled = false;
      });
    });

    finishBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('is-active');
      document.body.style.overflow = '';
    });
  });
</script>

</body>
</html>
